name: Rebuild WASM

on:
  repository_dispatch:
    types: [odzip-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout odzip source
        uses: actions/checkout@v4
        with:
          repository: odpay/odzip
          path: odzip-src

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WASM
        run: ODZIP_SRC=odzip-src ./build-wasm.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet wasm/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          ODZIP_VERSION: ${{ steps.diff.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wasm/odzip.js wasm/odzip.wasm
          DESCRIBE="$(cd odzip-src && git describe --tags --always)"
          git commit -m "rebuild wasm from odzip $DESCRIBE"
          git push
